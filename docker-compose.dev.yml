version: '3.8'

services:
  backend:
    build: ./backend
    container_name: docker-log-viewer-backend-dev
    ports:
      - "2001:2001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./backend/src:/app/src
    environment:
      - NODE_ENV=development
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env, see .env.example}"
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
    command: npm run dev

  # Frontend uchun local development
  # npm start bilan ishlatiladi (port 2000)
