services:
  backend:
    build: ./backend
    container_name: docker-log-viewer-backend
    restart: unless-stopped
    # Container actions in the UI can never stop or remove the viewer itself
    labels:
      - "docker-log-viewer.protected=true"
    expose:
      - "2001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - users-data:/app/src/data
      # Read-only view of the host filesystem so disk alerts measure the
      # server's disk, not the container's own layer
      - /:/host:ro
    # Lets Postgres / Redis alerts reach ports published on the Docker host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env, see .env.example}"
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-15m}
      - SESSION_MAX_AGE=${SESSION_MAX_AGE:-12h}
      # Audit events also go to stdout; the file survives container re-creation
      - AUDIT_LOG_FILE=${AUDIT_LOG_FILE:-/app/src/data/audit.log}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD:-}
      # Telegram alerts (off unless both token and chat id are set)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_API_BASE=${TELEGRAM_API_BASE:-}
      - ALERT_ENABLED=${ALERT_ENABLED:-}
      - ALERT_HOSTNAME=${ALERT_HOSTNAME:-}
      - ALERT_SERVER_IP=${ALERT_SERVER_IP:-}
      - ALERT_TIMEZONE=${ALERT_TIMEZONE:-}
      - ALERT_CONTAINER_RESOURCES=${ALERT_CONTAINER_RESOURCES:-}
      - ALERT_DISK_PATH=${ALERT_DISK_PATH:-/host}
      - ALERT_INTERVAL=${ALERT_INTERVAL:-60s}
      - ALERT_RENOTIFY=${ALERT_RENOTIFY:-30m}
      - ALERT_SUMMARY_INTERVAL=${ALERT_SUMMARY_INTERVAL:-24h}
      - ALERT_IGNORE_CONTAINERS=${ALERT_IGNORE_CONTAINERS:-}
      - ALERT_IGNORE_CI_RUNNERS=${ALERT_IGNORE_CI_RUNNERS:-}
      - ALERT_CPU_WARN=${ALERT_CPU_WARN:-}
      - ALERT_CPU_CRITICAL=${ALERT_CPU_CRITICAL:-}
      - ALERT_MEM_WARN=${ALERT_MEM_WARN:-}
      - ALERT_MEM_CRITICAL=${ALERT_MEM_CRITICAL:-}
      - ALERT_DISK_WARN=${ALERT_DISK_WARN:-}
      - ALERT_DISK_CRITICAL=${ALERT_DISK_CRITICAL:-}
      - ALERT_CONTAINER_CPU_WARN=${ALERT_CONTAINER_CPU_WARN:-}
      - ALERT_CONTAINER_CPU_CRITICAL=${ALERT_CONTAINER_CPU_CRITICAL:-}
      - ALERT_CONTAINER_MEM_WARN=${ALERT_CONTAINER_MEM_WARN:-}
      - ALERT_CONTAINER_MEM_CRITICAL=${ALERT_CONTAINER_MEM_CRITICAL:-}
      - ALERT_RESTART_WARN=${ALERT_RESTART_WARN:-}
      - ALERT_SERVICE_WARN=${ALERT_SERVICE_WARN:-}
      - ALERT_SERVICE_CRITICAL=${ALERT_SERVICE_CRITICAL:-}
      # Start / stop / restart / remove for admins ("false" turns it off)
      - CONTAINER_ACTIONS_ENABLED=${CONTAINER_ACTIONS_ENABLED:-true}
      - CONTAINER_ACTIONS_PROTECTED=${CONTAINER_ACTIONS_PROTECTED:-}
    networks:
      - log-viewer-network

  frontend:
    build: ./frontend
    container_name: docker-log-viewer-frontend
    restart: unless-stopped
    labels:
      - "docker-log-viewer.protected=true"
    ports:
      - "2000:80"
    depends_on:
      - backend
    networks:
      - log-viewer-network

volumes:
  users-data:

networks:
  log-viewer-network:
    driver: bridge
