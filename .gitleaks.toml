title = "docker-log-viewer secret scanning"

# Start from gitleaks' built-in rules (API keys, tokens, private keys, JWTs...)
[extend]
useDefault = true

# User data with password hashes must never be committed
[[rules]]
id = "bcrypt-password-hash"
description = "bcrypt password hash"
regex = '''\$2[aby]\$\d{2}\$[./A-Za-z0-9]{53}'''
keywords = ["$2a$", "$2b$", "$2y$"]
tags = ["password"]

[[rules]]
id = "runtime-user-data"
description = "Runtime user data (backend/src/data) is committed"
path = '''(^|/)backend/src/data/'''
tags = ["password"]

[[rules]]
id = "dotenv-file"
description = "Environment file with real settings is committed"
path = '''(^|/)\.env(\.local|\.[a-z]+\.local)?$'''
tags = ["config"]
